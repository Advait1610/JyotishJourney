databases:
  - name: jj-user-db
    plan: free
    databaseName: user_db
    user: postgres
    ipAllowList: []

  - name: jj-blog-db
    plan: free
    databaseName: blog_db
    user: postgres
    ipAllowList: []

services:
  # --- Discovery Server ---
  - type: web
    plan: free
    name: jj-discovery
    runtime: docker
    dockerfilePath: ./discovery-server/Dockerfile
    dockerContext: ./discovery-server
    envVars:
      - key: EUREKA_HOSTNAME
        value: jj-discovery

  # --- User Service ---
  - type: web
    plan: free
    name: jj-user-service
    runtime: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: jj-user-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: jj-user-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: jj-user-db
          property: password
      - key: SPRING_REDIS_HOST
        fromService:
          name: jj-redis
          type: redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          name: jj-redis
          type: redis
          property: port
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://jj-discovery.onrender.com/eureka/
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_FRONTEND_URL
        sync: false

  # --- Blog Service ---
  - type: web
    plan: free
    name: jj-blog-service
    runtime: docker
    dockerfilePath: ./blog-service/Dockerfile
    dockerContext: ./blog-service
    disk:
      name: blog-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: jj-blog-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: jj-blog-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: jj-blog-db
          property: password
      - key: SPRING_REDIS_HOST
        fromService:
          name: jj-redis
          type: redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          name: jj-redis
          type: redis
          property: port
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://jj-discovery.onrender.com/eureka/

  # --- API Gateway ---
  - type: web
    plan: free
    name: jj-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    envVars:
      - key: SPRING_REDIS_HOST
        fromService:
          name: jj-redis
          type: redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          name: jj-redis
          type: redis
          property: port
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://jj-discovery.onrender.com/eureka/
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # --- Frontend (Static Site) ---
  - type: web
    plan: static
    name: jj-frontend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    staticPublishPath: dist/jyotish-journey/browser
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: RENDER_API_URL
        sync: false
      - key: RENDER_GATEWAY_URL
        sync: false

  # --- Redis ---
  - type: redis
    name: jj-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
