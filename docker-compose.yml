services:
  postgres-user-db:
    image: postgres:16-alpine
    container_name: jj-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  postgres-blog-db:
    image: postgres:16-alpine
    container_name: jj-blog-db
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jj-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    container_name: jj-discovery
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: jj-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-JyotishJourneySecretKeyForJWTTokenGeneration2024MustBe256BitsLong!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/users/oauth2/callback}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
    depends_on:
      postgres-user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  blog-service:
    build: ./blog-service
    container_name: jj-blog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-blog-db:5432/blog_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    volumes:
      - blog-uploads:/app/uploads
    depends_on:
      postgres-blog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: jj-gateway
    environment:
      SPRING_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-JyotishJourneySecretKeyForJWTTokenGeneration2024MustBe256BitsLong!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_started
      blog-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jj-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  user-db-data:
  blog-db-data:
  blog-uploads:
  redis-data:
